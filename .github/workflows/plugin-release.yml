# Build one module plugin (VST3 + CLAP) on Windows, macOS and Linux and publish it as a GitHub Release of the
# calling module repo. Called from each MODULES.<CAT>.<Mxxx> repo's .github/workflows/plugin.yml:
#
#   jobs:
#     plugin:
#       uses: WardBeckSystems/Ward-Beck-Plugin-Core/.github/workflows/plugin-release.yml@main
#       with: { crate: wbs-m464 }
#       permissions: { contents: write }
name: plugin-release

on:
  workflow_call:
    inputs:
      crate:
        description: the plugin crate, e.g. wbs-m464
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-universal }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: SOFTWARE/plugin
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: SOFTWARE/plugin
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev \
            libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOFTWARE/plugin
      - name: Test the DSP
        run: cargo test --no-default-features   # not --locked: the lock was made against the local Plugin-Core (WBSps.ca override)
      - name: Bundle
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo xtask bundle-universal ${{ inputs.crate }} --release
          else
            cargo xtask bundle ${{ inputs.crate }} --release
          fi
      - name: Standalone application
        run: |
          code=$(echo ${{ inputs.crate }} | sed 's/^wbs-//' | tr a-z A-Z)
          app="WBS $code"
          bin=${{ inputs.crate }}-standalone
          mkdir -p target/standalone
          if [ "$RUNNER_OS" = macOS ]; then
            for t in x86_64-apple-darwin aarch64-apple-darwin; do cargo build --release --features standalone --bin $bin --target $t; done
            mkdir -p "target/standalone/$app.app/Contents/MacOS"
            lipo -create target/x86_64-apple-darwin/release/$bin target/aarch64-apple-darwin/release/$bin -output "target/standalone/$app.app/Contents/MacOS/$app"
            cat > "target/standalone/$app.app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>$app</string>
          <key>CFBundleIdentifier</key><string>ca.ward-beck.$(echo $code | tr A-Z a-z).standalone</string>
          <key>CFBundleName</key><string>$app</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#plugin-v}</string>
          <key>NSMicrophoneUsageDescription</key><string>$app processes audio from your input.</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          else
            cargo build --release --features standalone --bin $bin
            ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
            cp "target/release/$bin$ext" "target/standalone/$app$ext"
          fi
          ls -la target/standalone
      - name: Zip
        run: |
          curl -fsSL https://raw.githubusercontent.com/WardBeckSystems/Ward-Beck-Plugin-Core/main/LICENSE-PLUGINS.txt -o LICENSE.txt
          z() {  # z <zip> <dir> <item>
            if [ "$RUNNER_OS" = Windows ]; then (cd "$2" && 7z a -tzip "$1" "$3" >/dev/null) ; else (cd "$2" && zip -qry "$1" "$3"); fi
            if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$1" LICENSE.txt >/dev/null; else zip -qj "$1" LICENSE.txt; fi
          }
          here=$PWD
          for f in ${{ inputs.crate }}.vst3 ${{ inputs.crate }}.clap; do
            z "$here/${{ inputs.crate }}-${{ matrix.name }}-${f##*.}.zip" target/bundled "$f"
          done
          z "$here/${{ inputs.crate }}-${{ matrix.name }}-standalone.zip" target/standalone .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.crate }}-${{ matrix.name }}
          path: SOFTWARE/plugin/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'plugin-nightly' }}
        run: |
          ls -l dist
          notes="Ward-Beck ${{ inputs.crate }}: free, nothing locked (no licence key, no iLok, no activation). VST3, CLAP and a standalone application for Windows (x86_64), macOS (universal: Intel and Apple silicon) and Linux (x86_64).
          Unzip into your plug-in folder: VST3 → C:\\Program Files\\Common Files\\VST3, /Library/Audio/Plug-Ins/VST3, ~/.vst3; CLAP → …\\Common Files\\CLAP, /Library/Audio/Plug-Ins/CLAP, ~/.clap.
          macOS builds are not notarised yet: if macOS blocks the plug-in, run xattr -dr com.apple.quarantine on it.
          All Ward-Beck plugins: https://github.com/WardBeckSystems/Ward-Beck-Plugin-Core#plugins"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip -R "$GITHUB_REPOSITORY" --title "${{ inputs.crate }} $TAG" --notes "$notes" \
              $([ "$TAG" = plugin-nightly ] && echo --prerelease)
          fi
